name: One-time Gista action type fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[gista-type-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix save-count TypeScript types
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/profile/page.tsx')
          s = p.read_text()
          s = s.replace('Omit<Gist, "likes" | "responses" | "liked" | "saved">', 'Omit<Gist, "likes" | "responses" | "saves" | "liked" | "saved">')
          s = s.replace('saveRows = (savesResult.data ?? []) as Array<{ post_id: string }>;', 'saveRows = (savesResult.data ?? []) as Array<{ post_id: string; user_id: string }>;')
          p.write_text(s)

          p = Path('app/profile/[username]/page.tsx')
          s = p.read_text()
          s = s.replace('Omit<PublicPost, "likes" | "responses" | "liked" | "saved">', 'Omit<PublicPost, "likes" | "responses" | "saves" | "liked" | "saved">')
          p.write_text(s)
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "Gista Fix Bot"
          git config user.email "actions@gista.local"
          git add app/profile/page.tsx 'app/profile/[username]/page.tsx'
          git add .github/workflows/one-time-gista-type-fix.yml
          git rm .github/workflows/one-time-gista-type-fix.yml
          git commit -m "fix: correct save count types [gista-type-fix]"
          git push origin HEAD:main
