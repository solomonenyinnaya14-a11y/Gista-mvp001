name: One-time Trending empty state fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: trending empty state')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fix and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/page.tsx")
          text = path.read_text()

          old = '''          ) : posts.length === 0 ? (\n            <div className="empty-state">\n              <h3>No Gists yet</h3>\n              <p>\n                {tab === "Following"\n                  ? "Follow people to see their Gists here."\n                  : "Be the first person to start a Gist."}\n              </p>\n            </div>\n          ) : ('''

          new = '''          ) : posts.length === 0 ? (\n            <div className="empty-state">\n              <h3>{tab === "Trending" ? "No Trending Gists yet" : "No Gists yet"}</h3>\n              <p>\n                {tab === "Following"\n                  ? "Follow people to see their Gists here."\n                  : tab === "Trending"\n                    ? "When Gists start trending, they will appear here."\n                    : "Be the first person to start a Gist."}\n              </p>\n            </div>\n          ) : ('''

          if old not in text:
              raise SystemExit("Expected empty-state block was not found")

          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/fix-trending-empty-state.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/fix-trending-empty-state.yml
          git commit -m "fix: trending empty state"
          git push
