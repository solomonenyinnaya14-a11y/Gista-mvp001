name: One-time performance patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply performance changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          home=root/'app/page.tsx'
          s=home.read_text()
          s=s.replace(' const [tab,setTab]=useState("Discover"); const [user,setUser]=useState<{id:string;email?:string|null}|null>(null); const [profile,setProfile]=useState<Profile|null>(null); const [posts,setPosts]=useState<Post[]>([]); const [loading,setLoading]=useState(true); const [authReady,setAuthReady]=useState(false); const [feedError,setFeedError]=useState(""); const [busy,setBusy]=useState<string|null>(null); const [unreadNotifications,setUnreadNotifications]=useState(0);', ' const [tab,setTab]=useState("Discover"); const [user,setUser]=useState<{id:string;email?:string|null}|null>(null); const [profile,setProfile]=useState<Profile|null>(null); const [posts,setPosts]=useState<Post[]>([]); const [loading,setLoading]=useState(true); const [feedError,setFeedError]=useState(""); const [busy,setBusy]=useState<string|null>(null); const [unreadNotifications,setUnreadNotifications]=useState(0);')
          new_load=''' const loadPosts=useCallback(async(currentUser:{id:string}|null)=>{
            setLoading(true);setFeedError("");
            const limit=tab==="Following"?20:12;
            const query=supabase.from("posts").select("id,body,content_type,media_url,category,status,created_at,author_id,voice_duration_seconds").order("created_at",{ascending:false}).limit(limit);
            const blockedQuery=currentUser?supabase.from("blocks").select("blocked_id").eq("blocker_id",currentUser.id):Promise.resolve({data:[] as {blocked_id:string}[],error:null});
            const hiddenQuery=currentUser?supabase.from("not_interested").select("post_id").eq("user_id",currentUser.id):Promise.resolve({data:[] as {post_id:string}[],error:null});
            const followsQuery=currentUser&&tab==="Following"?supabase.from("follows").select("following_id").eq("follower_id",currentUser.id):Promise.resolve({data:[] as {following_id:string}[],error:null});
            const [postsResult,blockedResult,hiddenResult,followsResult]=await Promise.all([query,blockedQuery,hiddenQuery,followsQuery]);
            if(postsResult.error){setFeedError(postsResult.error.message);setPosts([]);setLoading(false);return}
            if(followsResult.error){setFeedError(followsResult.error.message);setPosts([]);setLoading(false);return}
            const blockedIds=new Set((blockedResult.data??[]).map((item:{blocked_id:string})=>item.blocked_id));
            const hiddenPostIds=new Set((hiddenResult.data??[]).map((item:{post_id:string})=>item.post_id));
            const followingIds=new Set((followsResult.data??[]).map((item:{following_id:string})=>item.following_id));
            let data=(postsResult.data??[]).filter(post=>{if(blockedIds.has(post.author_id)||hiddenPostIds.has(post.id))return false;if(tab==="Following"&&!followingIds.has(post.author_id))return false;return true});
            if(tab==="Trending")data=data.filter(post=>post.status==="trending");
            if(!data.length){setPosts([]);setLoading(false);return}
            const postIds=data.map(post=>post.id);const authorIds=[...new Set(data.map(post=>post.author_id))];
            const [likesResult,responsesResult,savesResult,profileResult,engagementResult]=await Promise.all([
              supabase.from("likes").select("post_id,user_id").in("post_id",postIds),
              supabase.from("responses").select("post_id").in("post_id",postIds),
              currentUser?supabase.from("saves").select("post_id").eq("user_id",currentUser.id).in("post_id",postIds):Promise.resolve({data:[] as {post_id:string}[],error:null}),
              supabase.from("profiles").select("id,display_name,username,avatar_url").in("id",authorIds),
              currentUser?supabase.from("post_engagement_counts").select("post_id,share_count,save_count").in("post_id",postIds):Promise.resolve({data:[] as EngagementCount[],error:null})
            ]);
            if(profileResult.error){setFeedError(profileResult.error.message);setPosts([]);setLoading(false);return}
            if(engagementResult.error){setFeedError(engagementResult.error.message);setPosts([]);setLoading(false);return}
            const likeCounts=Object.fromEntries(postIds.map(id=>[id,0]));const responseCounts=Object.fromEntries(postIds.map(id=>[id,0]));const shareCounts=Object.fromEntries(postIds.map(id=>[id,0]));const saveCounts=Object.fromEntries(postIds.map(id=>[id,0]));
            (likesResult.data??[]).forEach((item:{post_id:string})=>{likeCounts[item.post_id]=(likeCounts[item.post_id]??0)+1});
            (responsesResult.data??[]).forEach((item:{post_id:string})=>{responseCounts[item.post_id]=(responseCounts[item.post_id]??0)+1});
            (engagementResult.data??[]).forEach((item:EngagementCount)=>{shareCounts[item.post_id]=Number(item.share_count)||0;saveCounts[item.post_id]=Number(item.save_count)||0});
            const liked=new Set((likesResult.data??[]).filter((item:{user_id:string})=>item.user_id===currentUser?.id).map((item:{post_id:string})=>item.post_id));
            const saved=new Set((savesResult.data??[]).map((item:{post_id:string})=>item.post_id));
            const profilesById=new Map((profileResult.data??[]).map(item=>[item.id,item as Profile]));
            setPosts(data.map(post=>({...post,profiles:profilesById.get(post.author_id)??null,likes:likeCounts[post.id]??0,responses:responseCounts[post.id]??0,shares:shareCounts[post.id]??0,saves:saveCounts[post.id]??0,liked:liked.has(post.id),saved:saved.has(post.id)})));
            setLoading(false);
          },[supabase,tab]);'''
          s=re.sub(r' const loadPosts=useCallback\(async\(currentUser:\{id:string\}\|null\)=>\{.*?\},\[supabase,tab\]\);',new_load,s,count=1,flags=re.S)
          new_effect=''' useEffect(()=>{
            let active=true;let notificationChannel:ReturnType<typeof supabase.channel>|null=null;
            const initialize=async()=>{
              const {data:sessionData}=await supabase.auth.getSession();if(!active)return;
              const currentUser=sessionData.session?.user?{id:sessionData.session.user.id,email:sessionData.session.user.email}:null;
              setUser(currentUser);void loadPosts(currentUser);void loadProfile(currentUser);void loadNotifications(currentUser);
              if(currentUser){notificationChannel=supabase.channel("home-notifications-"+currentUser.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"recipient_id=eq."+currentUser.id},()=>void loadNotifications(currentUser)).on("postgres_changes",{event:"UPDATE",schema:"public",table:"notifications",filter:"recipient_id=eq."+currentUser.id},()=>void loadNotifications(currentUser)).subscribe()}
            };
            void initialize();
            const {data:authSubscription}=supabase.auth.onAuthStateChange((_event,session)=>{const currentUser=session?.user?{id:session.user.id,email:session.user.email}:null;setUser(currentUser);void loadPosts(currentUser);void loadProfile(currentUser);void loadNotifications(currentUser)});
            return()=>{active=false;authSubscription.subscription.unsubscribe();if(notificationChannel)void supabase.removeChannel(notificationChannel)}
          },[loadNotifications,loadPosts,loadProfile,supabase]);'''
          s=re.sub(r' useEffect\(\(\)=>\{let active=true;let notificationChannel:ReturnType<typeof supabase\.channel>\|null=null;const initialize=.*?\n useEffect\(\(\)=>\{if\(!authReady\)return;void loadPosts\(user\)\},\[authReady,loadPosts,user\]\);',new_effect,s,count=1,flags=re.S)
          home.write_text(s)

          profile=root/'app/profile/page.tsx'
          s=profile.read_text()
          new_profile_load='''  async function loadProfile() {
            setError("");
            const { data: { session } } = await supabase.auth.getSession();
            const user = session?.user ?? null;
            if (!user) { router.replace("/auth"); return; }
            const profilePromise = supabase.from("profiles").select(PROFILE_SELECT).eq("id", user.id).maybeSingle();
            const statsPromise = supabase.rpc("get_profile_stats", { target_profile_id: user.id });
            const gistsPromise = supabase.from("posts").select("id,content_type,body,media_url,category,status,created_at,voice_duration_seconds").eq("author_id", user.id).order("created_at", { ascending: false }).limit(12);
            let { data, error: profileError } = await profilePromise;
            if (!data && !profileError) { const { data: created, error: createError } = await supabase.from("profiles").insert({ id: user.id, display_name: "", username: null, bio: "" }).select(PROFILE_SELECT).single(); data = created; profileError = createError; }
            if (profileError || !data) { setError(profileError?.message ?? "We couldn't load your profile."); setLoading(false); return; }
            setProfile(data as Profile);setDisplayName(data.display_name ?? "");setUsername(data.username ?? "");setBio(data.bio ?? "");setLoading(false);
            const [{ data: statsData }, { data: ownGistsData }] = await Promise.all([statsPromise, gistsPromise]);
            const profileStats = statsData?.[0] as { gists?: number; followers?: number; following?: number } | undefined;
            const ownGists = (ownGistsData ?? []) as Array<Omit<Gist, "likes" | "responses" | "liked" | "saved">>;
            const postIds = ownGists.map((gist) => gist.id);
            let likeRows: Array<{ post_id: string; user_id: string }> = [];let responseRows: Array<{ post_id: string }> = [];let saveRows: Array<{ post_id: string }> = [];
            if (postIds.length) { const [likesResult, responsesResult, savesResult] = await Promise.all([supabase.from("likes").select("post_id,user_id").in("post_id", postIds),supabase.from("responses").select("post_id").in("post_id", postIds),supabase.from("saves").select("post_id").eq("user_id", user.id).in("post_id", postIds)]);likeRows=(likesResult.data??[]) as Array<{post_id:string;user_id:string}>;responseRows=(responsesResult.data??[]) as Array<{post_id:string}>;saveRows=(savesResult.data??[]) as Array<{post_id:string}>;}
            const likeCounts=Object.fromEntries(postIds.map((id)=>[id,0]));const responseCounts=Object.fromEntries(postIds.map((id)=>[id,0]));likeRows.forEach((row)=>{likeCounts[row.post_id]=(likeCounts[row.post_id]??0)+1});responseRows.forEach((row)=>{responseCounts[row.post_id]=(responseCounts[row.post_id]??0)+1});
            const liked=new Set(likeRows.filter((row)=>row.user_id===user.id).map((row)=>row.post_id));const saved=new Set(saveRows.map((row)=>row.post_id));
            setStats({gists:Number(profileStats?.gists??0),followers:Number(profileStats?.followers??0),following:Number(profileStats?.following??0)});
            setGists(ownGists.map((gist)=>{const likes=likeCounts[gist.id]??0;const responses=responseCounts[gist.id]??0;const status=likes>0||responses>0?(gist.status??"growing"):null;return {...gist,status,likes,responses,liked:liked.has(gist.id),saved:saved.has(gist.id)}}));
          }'''
          s=re.sub(r'  async function loadProfile\(\) \{.*?\n  useEffect\(\(\) => \{ void loadProfile\(\); \}, \[supabase\]\);',new_profile_load+'\n  useEffect(() => { void loadProfile(); }, [supabase]);',s,count=1,flags=re.S)
          profile.write_text(s)
          PY
      - name: Commit and remove one-time patcher
        run: |
          rm -f .github/workflows/one-time-performance-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/profile/page.tsx .github/workflows/one-time-performance-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m "Improve home and profile loading performance"
          git push
