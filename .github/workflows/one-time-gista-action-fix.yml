name: One-time Gista action state fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[gista-action-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply action state and profile save-count fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          theme = Path('app/theme.css')
          text = theme.read_text()
          text = re.sub(r'\n/\* Like and Save stay Gista purple; Response and Share stay neutral gray\. \*/[\s\S]*$', '\n', text)
          theme.write_text(text)

          action_css = Path('app/action-theme-fixes.css')
          action_css.write_text('''/* Gista action state colors — state, not position.\n   Unselected Like/Save/Response/Share are neutral gray.\n   Selected Like/Save icons are Gista purple. Counts always stay gray. */\n\n.actions > *,\n.actions > * svg {\n  color: #77727f !important;\n}\n\n.actions > * svg[fill="currentColor"] {\n  color: #7c3aed !important;\n}\n\n.actions .action-count {\n  color: #77727f !important;\n}\n\n.actions > .share-action,\n.actions > .share-action svg,\n.actions .feed-action-link.share-action,\n.actions .feed-action-link.share-action svg {\n  color: #77727f !important;\n}\n\nhtml[data-theme="dark"] .actions > *,\nhtml[data-theme="dark"] .actions > * svg {\n  color: #aaa4b1 !important;\n}\n\nhtml[data-theme="dark"] .actions > * svg[fill="currentColor"] {\n  color: #7c3aed !important;\n}\n\nhtml[data-theme="dark"] .actions .action-count {\n  color: #aaa4b1 !important;\n}\n\nhtml[data-theme="dark"] .actions > .share-action,\nhtml[data-theme="dark"] .actions > .share-action svg,\nhtml[data-theme="dark"] .actions .feed-action-link.share-action,\nhtml[data-theme="dark"] .actions .feed-action-link.share-action svg {\n  color: #aaa4b1 !important;\n}\n''')

          profile = Path('app/profile/page.tsx')
          text = profile.read_text()
          text = text.replace('  responses: number;\n  liked: boolean;', '  responses: number;\n  saves: number;\n  liked: boolean;')
          text = text.replace('    let saveRows: Array<{ post_id: string }> = [];', '    let saveRows: Array<{ post_id: string; user_id: string }> = [];')
          text = text.replace('          .select("post_id")\n          .eq("user_id", user.id)\n          .in("post_id", postIds),', '          .select("post_id,user_id")\n          .in("post_id", postIds),')
          text = text.replace('    const saved = new Set(saveRows.map((row) => row.post_id));', '    const saveCounts = Object.fromEntries(postIds.map((id) => [id, 0]));\n    saveRows.forEach((row) => { saveCounts[row.post_id] = (saveCounts[row.post_id] ?? 0) + 1; });\n    const saved = new Set(saveRows.filter((row) => row.user_id === user.id).map((row) => row.post_id));')
          text = text.replace('          responses,\n          liked: liked.has(gist.id),', '          responses,\n          saves: saveCounts[gist.id] ?? 0,\n          liked: liked.has(gist.id),')
          text = text.replace('item.id === gist.id ? { ...item, saved: !item.saved } : item', 'item.id === gist.id\n            ? { ...item, saved: !item.saved, saves: Math.max(0, item.saves + (item.saved ? -1 : 1)) }\n            : item')
          text = text.replace('<button type="button" onClick={() => void toggleSave(gist)} disabled={busy === gist.id + "s"} aria-label="Save Gist"><Bookmark size={18} fill={gist.saved ? "currentColor" : "none"} /></button>', '<button type="button" className={gist.saved ? "saved-action" : ""} onClick={() => void toggleSave(gist)} disabled={busy === gist.id + "s"} aria-label="Save Gist"><Bookmark size={18} fill={gist.saved ? "currentColor" : "none"} /> {gist.saves}</button>')
          profile.write_text(text)

          public_profile = Path('app/profile/[username]/page.tsx')
          text = public_profile.read_text()
          text = text.replace('  responses: number;\n  liked: boolean;', '  responses: number;\n  saves: number;\n  liked: boolean;')
          text = text.replace('      user\n        ? supabase.from("saves").select("post_id").eq("user_id", user.id).in("post_id", postIds)\n        : Promise.resolve({ data: [] as { post_id: string }[] }),', '      supabase.from("saves").select("post_id,user_id").in("post_id", postIds),')
          text = text.replace('    const saved = new Set((savesResult.data ?? []).map((row: { post_id: string }) => row.post_id));', '    const saveCounts = Object.fromEntries(postIds.map((postId) => [postId, 0]));\n    (savesResult.data ?? []).forEach((row: { post_id: string }) => { saveCounts[row.post_id] = (saveCounts[row.post_id] ?? 0) + 1; });\n    const saved = new Set((savesResult.data ?? []).filter((row: { user_id: string }) => row.user_id === user?.id).map((row: { post_id: string }) => row.post_id));')
          text = text.replace('        responses,\n        liked: liked.has(post.id),', '        responses,\n        saves: saveCounts[post.id] ?? 0,\n        liked: liked.has(post.id),')
          text = text.replace('{ ...item, saved: !item.saved }', '{ ...item, saved: !item.saved, saves: Math.max(0, item.saves + (item.saved ? -1 : 1)) }')
          text = text.replace('<button type="button" onClick={() => void toggleSave(post)} disabled={busy === post.id + "s"} aria-label="Save Gist"><Bookmark size={18} fill={post.saved ? "currentColor" : "none"} /></button>', '<button type="button" className={post.saved ? "saved-action" : ""} onClick={() => void toggleSave(post)} disabled={busy === post.id + "s"} aria-label="Save Gist"><Bookmark size={18} fill={post.saved ? "currentColor" : "none"} /> {post.saves}</button>')
          public_profile.write_text(text)

          saved = Path('app/saved/page.tsx')
          text = saved.read_text()
          text = text.replace('<Link className="feed-action-link" href={"/gist/" + post.id}><Heart size={18} fill={post.liked ? "currentColor" : "none"} /> {post.likes}</Link>', '<Link className={post.liked ? "feed-action-link liked" : "feed-action-link"} href={"/gist/" + post.id}><Heart size={18} fill={post.liked ? "currentColor" : "none"} /> {post.likes}</Link>')
          saved.write_text(text)

          globals = Path('app/globals.css')
          text = globals.read_text()
          text = text.replace('.actions button.share-action,.actions button.share-action svg{color:#7c3aed}.actions .feed-action-link.share-action{color:#7c3aed}', '')
          globals.write_text(text)

          checks = {
              'profile saves field': 'saves: number;' in profile.read_text(),
              'profile save count render': '{gist.saves}' in profile.read_text(),
              'public save count render': '{post.saves}' in public_profile.read_text(),
              'state css': 'svg[fill="currentColor"]' in action_css.read_text(),
              'legacy unconditional purple removed': 'actions button:nth-child(1)' not in theme.read_text(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Fix validation failed: ' + ', '.join(failed))

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name "Gista Fix Bot"
          git config user.email "actions@gista.local"
          git add app/theme.css app/action-theme-fixes.css app/globals.css app/profile/page.tsx 'app/profile/[username]/page.tsx' app/saved/page.tsx
          git add .github/workflows/one-time-gista-action-fix.yml
          git rm .github/workflows/one-time-gista-action-fix.yml
          git commit -m "fix: make like and save colors state based [gista-action-fix]"
          git push origin HEAD:main
