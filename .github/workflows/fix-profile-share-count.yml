name: One-time Profile share count fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: profile share count')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply profile share-count fix and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          profile = Path("app/profile/page.tsx")
          text = profile.read_text()

          replacements = [
              (
                  '  saves: number;\n  liked: boolean;',
                  '  saves: number;\n  shares: number;\n  liked: boolean;',
              ),
              (
                  '      Omit<Gist, "likes" | "responses" | "saves" | "liked" | "saved">\n',
                  '      Omit<Gist, "likes" | "responses" | "saves" | "shares" | "liked" | "saved">\n',
              ),
              (
                  '    let saveRows: Array<{ post_id: string; user_id: string }> = [];\n',
                  '    let saveRows: Array<{ post_id: string; user_id: string }> = [];\n    let engagementRows: Array<{ post_id: string; share_count: number | string }> = [];\n',
              ),
              (
                  '        supabase\n          .from("saves")\n          .select("post_id,user_id")\n          .in("post_id", postIds),\n',
                  '        supabase\n          .from("saves")\n          .select("post_id,user_id")\n          .in("post_id", postIds),\n        supabase\n          .from("post_engagement_counts")\n          .select("post_id,share_count")\n          .in("post_id", postIds),\n',
              ),
              (
                  '      const [likesResult, responsesResult, savesResult] = await Promise.all([\n',
                  '      const [likesResult, responsesResult, savesResult, engagementResult] = await Promise.all([\n',
              ),
              (
                  '      saveRows = (savesResult.data ?? []) as Array<{ post_id: string; user_id: string }>;\n',
                  '      saveRows = (savesResult.data ?? []) as Array<{ post_id: string; user_id: string }>;\n      engagementRows = (engagementResult.data ?? []) as Array<{ post_id: string; share_count: number | string }>;\n',
              ),
              (
                  '    const saveCounts = Object.fromEntries(postIds.map((id) => [id, 0]));\n',
                  '    const saveCounts = Object.fromEntries(postIds.map((id) => [id, 0]));\n    const shareCounts = Object.fromEntries(postIds.map((id) => [id, 0]));\n    engagementRows.forEach((row) => { shareCounts[row.post_id] = Number(row.share_count) || 0; });\n',
              ),
              (
                  '        const status = likes > 0 || responses > 0 ? gist.status ?? "growing" : null;\n',
                  '        const shares = shareCounts[gist.id] ?? 0;\n        const status = likes > 0 || responses > 0 || shares > 0 ? gist.status ?? "growing" : null;\n',
              ),
              (
                  '          saves: saveCounts[gist.id] ?? 0,\n          liked:',
                  '          saves: saveCounts[gist.id] ?? 0,\n          shares,\n          liked:',
              ),
              (
                  '  function shareGist(gist: Gist) {\n    const url = window.location.origin + "/gist/" + gist.id;\n    if (navigator.share)\n      void navigator.share({ title: "Gista", text: gist.body ?? "Join this Gist on Gista", url });\n    else void navigator.clipboard.writeText(url);\n  }\n',
                  '  async function shareGist(gist: Gist) {\n    const { data: { user } } = await supabase.auth.getUser();\n    if (!user) return router.replace("/auth");\n    const url = window.location.origin + "/gist/" + gist.id;\n    try {\n      if (navigator.share) {\n        await navigator.share({ title: "Gista", text: gist.body ?? "Join this Gist on Gista", url });\n      } else {\n        await navigator.clipboard.writeText(url);\n      }\n      const result = await supabase.from("shares").insert({ post_id: gist.id, user_id: user.id });\n      if (!result.error) {\n        setGists((current) => current.map((item) => item.id === gist.id ? { ...item, shares: item.shares + 1, status: item.status ?? "growing" } : item));\n      }\n    } catch {\n      // User cancelled the native share sheet.\n    }\n  }\n',
              ),
              (
                  '<button type="button" onClick={() => shareGist(gist)} aria-label="Share Gist"><Share2 size={18} /></button>',
                  '<button type="button" onClick={() => void shareGist(gist)} aria-label="Share Gist"><Share2 size={18} /> {gist.shares}</button>',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected profile pattern not found: {old[:80]!r}")
              text = text.replace(old, new, 1)
          profile.write_text(text)

          public_profile = Path("app/profile/[username]/page.tsx")
          text = public_profile.read_text()
          replacements = [
              (
                  '  saves: number;\n  liked: boolean;',
                  '  saves: number;\n  shares: number;\n  liked: boolean;',
              ),
              (
                  'const ownPosts = (postsResult.data ?? []) as Array<Omit<PublicPost, "likes" | "responses" | "saves" | "liked" | "saved">>;',
                  'const ownPosts = (postsResult.data ?? []) as Array<Omit<PublicPost, "likes" | "responses" | "saves" | "shares" | "liked" | "saved">>;',
              ),
              (
                  '    const [likesResult, responsesResult, savesResult] = await Promise.all([\n',
                  '    const [likesResult, responsesResult, savesResult, engagementResult] = await Promise.all([\n',
              ),
              (
                  '      supabase.from("saves").select("post_id,user_id").in("post_id", postIds),\n',
                  '      supabase.from("saves").select("post_id,user_id").in("post_id", postIds),\n      supabase.from("post_engagement_counts").select("post_id,share_count").in("post_id", postIds),\n',
              ),
              (
                  '    const saveCounts = Object.fromEntries(postIds.map((postId) => [postId, 0]));\n',
                  '    const saveCounts = Object.fromEntries(postIds.map((postId) => [postId, 0]));\n    const shareCounts = Object.fromEntries(postIds.map((postId) => [postId, 0]));\n    (engagementResult.data ?? []).forEach((row: { post_id: string; share_count: number | string }) => { shareCounts[row.post_id] = Number(row.share_count) || 0; });\n',
              ),
              (
                  '      const status = post.status ?? (likes > 0 || responses > 0 ? "growing" : null);\n',
                  '      const shares = shareCounts[post.id] ?? 0;\n      const status = post.status ?? (likes > 0 || responses > 0 || shares > 0 ? "growing" : null);\n',
              ),
              (
                  '        saves: saveCounts[post.id] ?? 0,\n        liked:',
                  '        saves: saveCounts[post.id] ?? 0,\n        shares,\n        liked:',
              ),
              (
                  '  function share(post: PublicPost) {\n    const url = window.location.origin + "/gist/" + post.id;\n    if (navigator.share) void navigator.share({ title: "Gista", text: post.body ?? "Join this Gist on Gista", url });\n    else void navigator.clipboard.writeText(url);\n  }\n',
                  '  async function share(post: PublicPost) {\n    if (!me) { router.push("/auth"); return; }\n    const url = window.location.origin + "/gist/" + post.id;\n    try {\n      if (navigator.share) {\n        await navigator.share({ title: "Gista", text: post.body ?? "Join this Gist on Gista", url });\n      } else {\n        await navigator.clipboard.writeText(url);\n      }\n      const result = await supabase.from("shares").insert({ post_id: post.id, user_id: me.id });\n      if (!result.error) setGists((current) => current.map((item) => item.id === post.id ? { ...item, shares: item.shares + 1, status: item.status ?? "growing" } : item));\n    } catch {\n      // User cancelled the native share sheet.\n    }\n  }\n',
              ),
              (
                  '<button type="button" onClick={() => share(post)} aria-label="Share Gist"><Share2 size={18} /></button>',
                  '<button type="button" onClick={() => void share(post)} aria-label="Share Gist"><Share2 size={18} /> {post.shares}</button>',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected public profile pattern not found: {old[:80]!r}")
              text = text.replace(old, new, 1)
          public_profile.write_text(text)
          PY

          rm .github/workflows/fix-profile-share-count.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/profile/page.tsx 'app/profile/[username]/page.tsx' .github/workflows/fix-profile-share-count.yml
          git commit -m "fix: profile share count"
          git push
